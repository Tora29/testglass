version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    # 件名を .claude/rules/git-workflow.md の形式にする（chore(deps): …）
    commit-message:
      prefix: chore
      include: scope
    groups:
      # minor・patch は 1 つの PR にまとめる。major は変更点を確かめたいので個別の PR にする
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
